[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "willitharness"
version = "0.0.0"
description = "Check whether the rules you write for a coding agent work."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/andrey1souza/willitharness"

[project.scripts]
willitharness = "willitharness.cli:entry_point"

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "pytest-bdd>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live' --strict-markers"
markers = [
  "AtBound: tag from the features directory",
  "Channel: tag from the features directory",
  "Completed: tag from the features directory",
  "D1: tag from the features directory",
  "D10: tag from the features directory",
  "D11: tag from the features directory",
  "D12: tag from the features directory",
  "D2: tag from the features directory",
  "D3: tag from the features directory",
  "D4: tag from the features directory",
  "D5: tag from the features directory",
  "D6: tag from the features directory",
  "D7: tag from the features directory",
  "D8: tag from the features directory",
  "D9: tag from the features directory",
