name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync
      - run: uv run pytest
      - run: uv run python scripts/gates/mutants.py all
      - run: uv run python scripts/gates/trace_check.py

  zanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: benomahony/zanity@08a2173a078d90d83b75d8586658f6ebcb52adcf # v0.3.1
        with:
          version: "0.3.1"
          args: check . --baseline zanity-baseline.json --new-only --fail-on warning
