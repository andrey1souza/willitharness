name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest tests/unit

  behavior-tests:
    name: Behavior tests, BDD scenarios (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest tests/bdd

  property-tests:
    name: Property-based tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest tests/property

  golden-tests:
    name: Golden-table conformance tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest tests/golden

  tooling-tests:
    name: Tests of the repo's own guards, gates and site builder (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest tests/guards tests/gates tests/site

  mutation-tests:
    name: Mutation tests, do the tests catch injected bugs (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run python scripts/gates/mutants.py all

  traceability:
    name: Traceability check, every contract rule has a test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run python scripts/gates/trace_check.py

  repo-rules:
    name: Repository rule checks, static (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run python scripts/gates/repo_checks.py

  site-build:
    name: Site build and freshness check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run python scripts/site/build.py --check

  simulation:
    name: Statistical simulation, false-positive rate and power (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run python scripts/gates/simulate.py --trials 400 --n 20 --seed 20261117

  macos-full:
    name: Full tests, mutation, traceability and repository checks on macOS (sandbox tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run python scripts/gates/mutants.py all
      - run: uv run python scripts/gates/trace_check.py
      - run: uv run python scripts/gates/repo_checks.py

  oldest-python-linux:
    name: Tests on the oldest Python the project supports (Linux, advisory, not required)
    runs-on: ubuntu-latest
    env:
      UV_MANAGED_PYTHON: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run python scripts/gates/trace_check.py
      - run: uv run python scripts/gates/repo_checks.py

  latest-python-linux:
    name: Tests, mutation, traceability and repo checks, latest Python (Linux, advisory, not required)
    runs-on: ubuntu-latest
    env:
      UV_MANAGED_PYTHON: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3"
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run python scripts/gates/mutants.py all
      - run: uv run python scripts/gates/trace_check.py
      - run: uv run python scripts/gates/repo_checks.py

  latest-python-macos:
    name: Tests, mutation, traceability and repo checks, latest Python (macOS, advisory, not required)
    runs-on: macos-latest
    env:
      UV_MANAGED_PYTHON: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3"
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run python scripts/gates/mutants.py all
      - run: uv run python scripts/gates/trace_check.py
      - run: uv run python scripts/gates/repo_checks.py

  zanity:
    name: Static analysis with zanity (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: benomahony/zanity@08a2173a078d90d83b75d8586658f6ebcb52adcf # v0.3.1
        with:
          version: "0.3.1"
          args: check . --fail-on warning

  gitleaks:
    name: Secret scan with gitleaks (Linux)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks at the pinned checksum
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/${archive}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}" gitleaks
      - run: ${{ runner.temp }}/gitleaks git --redact --no-banner
